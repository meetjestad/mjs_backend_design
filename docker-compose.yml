---
services:
  web:
    image: nginx
    volumes:
      - ./nginx-config:/etc/nginx/templates
      - ./htdocs:/data/htdocs
    ports:
      - 127.0.0.1:8080:80
    environment:
      SENSORTHINGS_URL: http://frost-web:8080/FROST-Server/v1.1
    links:
      - osh:osh

  redis:
    image: redis:latest
    restart: always
    ports:
      # For testing scripts outside docker
      - 127.0.0.1:63790:6379
    volumes:
      - redis-data:/data

  timescale:
    image: timescale/timescaledb:latest-pg11
    restart: always
    ports:
      # For testing scripts outside docker
      - 127.0.0.1:54320:5432
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - timescale-data:/var/lib/postgresql/data

  ttn-redis-producer:
    build: ttn-redis-producer
    restart: always
    links:
      - redis:redis
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
     - secrets.env
     - ttn-redis-producer/config.env

  ttn-redis-decoder:
    build: ttn-redis-decoder
    restart: always
    links:
      - redis:redis
      - timescale:timescale
      - web:web
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://postgres:password@timescale:5432/postgres
      # TODO: Use external DNS name if we have it later?
      CONSYS_URL: http://web/sensorhub/consys
    env_file:
     - ttn-redis-decoder/config.env

  ttn-redis-converter:
    build: ttn-redis-converter
    restart: always
    links:
      - redis:redis
    environment:
      REDIS_URL: redis://redis:6379/0
    env_file:
     - secrets.env
     - ttn-redis-converter/config.env
    # Temporarily prevent this from running
    profiles:
     - disabled

  frost-web:
    # We need 2.7.0 for https://github.com/FraunhoferIOSB/FROST-Server/issues/2142
    image: fraunhoferiosb/frost-server:2.7.0-SNAPSHOT
    environment:
      # For all settings see: https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      #- serviceRootUrl=http://localhost:8081/sta
      - plugins_multiDatastream.enable=true
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://frost-db:5432/frost
      - persistence_db_username=frost
      - persistence_db_password=some_password
      - persistence_autoUpdateDatabase=true
      - logSensitiveData=true
    #ports:
    #  - 127.0.0.1:1883:1883
    depends_on:
      frost-db:
        condition: service_healthy

  frost-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=frost
      - POSTGRES_USER=frost
      - POSTGRES_PASSWORD=some_password
    volumes:
      - frost-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d frost -U frost "]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  frost-db-data:
  redis-data:
  timescale-data:
  osh-data:
