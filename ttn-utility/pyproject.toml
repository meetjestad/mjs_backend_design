[tool.poetry]
name = "ttn-utility"
version = "0.1.0"
description = "Utility for importing and exporting TTN messages"
authors = ["Matthijs Kooijman <matthijs@stdin.nl>"]
license = "CC0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
redis = "^7.1.0"
#pony = "^0.7.19"
pony = { git = "https://github.com/black-sliver/pony.git", branch = "feat/py314" }
psycopg2-binary = "^2.9.11"
iso8601 = "^2.1.0"
requests = "^2.32.5"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
