[tool.poetry]
name = "ttn-utility"
version = "0.1.0"
description = "Utility for importing and exporting TTN messages"
authors = ["Matthijs Kooijman <matthijs@stdin.nl>"]
license = "CC0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
redis = "^7.1.0"
psycopg2-binary = "^2.9.11"
iso8601 = "^2.1.0"
requests = "^2.32.5"
duckdb = "^1.5.0"
pytz = "^2026.1.post1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
